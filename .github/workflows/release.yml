name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          brew update
          brew install ffmpeg-full

      - name: Install python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller dmgbuild pytest

      - name: Run unit tests
        run: |
          pytest -q

      - name: Build app (PyInstaller)
        run: |
          python -m PyInstaller packaging/pyinstaller/ReelsFactoryPro.spec

      - name: Build DMG
        run: |
          python packaging/macos/build_dmg.py

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 ReelsFactoryPro.dmg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ReelsFactoryPro.dmg
            dist/SHA256SUMS.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install cx_Freeze pytest

      - name: Run unit tests
        run: |
          pytest -q

      - name: Build MSI (cx_Freeze)
        run: |
          python packaging\windows\cxfreeze_setup.py bdist_msi

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist\SHA256SUMS.txt -Append -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/SHA256SUMS.txt

