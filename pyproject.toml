[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-factory"
version = "1.5.0"
description = "Descarga de TikTok, procesado a Facebook Reels y subtítulos automáticos con Whisper."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ReelsFactoryPro" }]
keywords = ["tiktok", "reels", "facebook", "whisper", "ffmpeg", "video"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.10.26",
    "PySide6>=6.12.0",
    "openai-whisper>=20250625",
    "torch>=2.6.0",
    "numpy>=2.0.2,<2.6",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.5",
    "pyinstaller>=6.22.3",
    "dmgbuild>=1.6.7; sys_platform == 'darwin'",
    "cx_Freeze>=8.7.4; sys_platform == 'win32'",
    # Para recolectar los tests sin torch/whisper.
    "numpy>=2.0.2,<2.6",
]

[project.scripts]
reels-factory = "app:main"

[project.urls]
Homepage = "https://github.com/ryxploit/reels_factory"
Issues = "https://github.com/ryxploit/reels_factory/issues"

[tool.setuptools]
# Layout plano: los módulos viven en la raíz del repositorio y se exponen
# como módulos de primer nivel (`config`, `app`, `downloader`, ...), que es
# como los importa el propio proyecto.
py-modules = [
    "app",
    "config",
    "deps",
    "downloader",
    "evasion",
    "jobstore",
    "pipeline",
    "processor",
    "settings",
    "subtitler",
    "subtitles",
    "utils",
    "video_processor",
    "watermark",
]

[tool.setuptools.data-files]
"assets" = ["assets/icon.svg", "assets/logo.svg"]
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
# Cobertura de los módulos de producción (sin umbral: solo se reporta).
addopts = "-ra --strict-markers --cov=. --cov-report=term-missing:skip-covered"
filterwarnings = [
    "ignore::DeprecationWarning",
    # PySide6 registra rutas fuente fantasma bajo cwd (shibokensupport, etc.).
    "ignore:Couldn't parse .*:coverage.exceptions.CoverageWarning",
]

[tool.coverage.run]
# Layout plano: los módulos de producción viven en la raíz del repo.
source = ["."]
omit = [
    "tests/*",
    "build_tools/*",
    "build/*",
    "dist/*",
    ".venv/*",
    "shibokensupport/*",
    "signature_bootstrap.py",
    "pyscript",
    "*/tests/*",
    "*/build_tools/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "third_party", "build_tools/macos/generated_icons"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "E501",    # el límite de línea lo controla el formatter
    "B008",    # llamadas en argumentos por defecto (idiomático en dataclasses)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"build_tools/*" = ["E402"]
